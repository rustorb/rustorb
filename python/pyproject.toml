[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "rustorb"
version = "0.1.1"
description = "CORBA ORB with its core in Rust: the Python binding"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
  "Topic :: Software Development :: Object Brokering",
]

[project.urls]
Homepage = "https://github.com/rustorb/rustorb"
Documentation = "https://github.com/rustorb/rustorb/blob/main/docs/getting-started.md"
Changelog = "https://github.com/rustorb/rustorb/blob/main/CHANGELOG.md"

[tool.maturin]
# The native module is the rustorb-python crate; the Python package is
# rustorb/ next to this file.
manifest-path = "../crates/rustorb-python/Cargo.toml"
python-source = "."
python-packages = ["rustorb"]
module-name = "rustorb._native"
include = ["rustorb/*.pyi"]
exclude = ["rustorb/__pycache__/**", "rustorb/_native*.so", "rustorb/_native*.pyd"]
