[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rustorb-omniorb-compat"
version = "0.1.1"
description = "omniORBpy compatibility layer for rustorb: `from omniORB import CORBA` on rustorb"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
  "Topic :: Software Development :: Object Brokering",
]
dependencies = ["rustorb"]

[project.urls]
Homepage = "https://github.com/rustorb/rustorb"
Documentation = "https://github.com/rustorb/rustorb/blob/main/docs/getting-started.md"
Changelog = "https://github.com/rustorb/rustorb/blob/main/CHANGELOG.md"

[tool.setuptools]
# omniORBpy's layout: the omniORB package, the standard mapping modules at
# the top level and the CosNaming stubs (generated by rustorb-idl from
# crates/rustorb-codegen/tests/idl/CosNaming.idl, see generate-stubs.sh).
packages = ["omniORB", "CosNaming", "CosNaming__POA"]
py-modules = ["CORBA", "PortableServer", "PortableServer__POA", "CosNaming_idl"]

[tool.setuptools.package-data]
CosNaming = ["*.pyi"]
CosNaming__POA = ["*.pyi"]
