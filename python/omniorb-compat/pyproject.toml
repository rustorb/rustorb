[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rustorb-omniorb-compat"
version = "0.0.0"
description = "omniORBpy compatibility layer for rustorb: `from omniORB import CORBA` on rustorb"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["rustorb"]

[tool.setuptools]
# omniORBpy's layout: the omniORB package, the standard mapping modules at
# the top level and the CosNaming stubs (generated by rustorb-idl from
# crates/rustorb-codegen/tests/idl/CosNaming.idl, see generate-stubs.sh).
packages = ["omniORB", "CosNaming", "CosNaming__POA"]
py-modules = ["CORBA", "PortableServer", "PortableServer__POA", "CosNaming_idl"]

[tool.setuptools.package-data]
CosNaming = ["*.pyi"]
CosNaming__POA = ["*.pyi"]
