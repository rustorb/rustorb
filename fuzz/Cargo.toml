[package]
name = "rustorb-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rustorb-cdr = { path = "../crates/rustorb-cdr" }
rustorb-giop = { path = "../crates/rustorb-giop" }

# Kept out of the main workspace: fuzzing needs a nightly toolchain.
[workspace]
members = ["."]

[[bin]]
name = "cdr_decoder"
path = "fuzz_targets/cdr_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "giop_message"
path = "fuzz_targets/giop_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fragment_assembler"
path = "fuzz_targets/fragment_assembler.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ior"
path = "fuzz_targets/ior.rs"
test = false
doc = false
bench = false

[[bin]]
name = "object_url"
path = "fuzz_targets/object_url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xcdr_decoder"
path = "fuzz_targets/xcdr_decoder.rs"
test = false
doc = false
bench = false
