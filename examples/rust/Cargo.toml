# The Rust example (examples/README.md). Not a member of the rustorb
# workspace: building it needs rustorb-idl on PATH.
[package]
name = "rustorb-example"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rustorb-core = { path = "../../crates/rustorb-core", version = "0.3" }
rustorb-naming = { path = "../../crates/rustorb-naming", version = "0.3" }

[build-dependencies]
# From crates.io: the generator lives in https://github.com/rustorb/rustorb-idl.
rustorb-codegen = "0.2"
