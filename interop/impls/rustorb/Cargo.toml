[package]
name = "rustorb-interop"
description = "rustorb client and server for the interop tests, with the stubs and skeletons rustorb-idl -brust generates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "rustorb-interop-client"
path = "src/main.rs"

[[bin]]
name = "rustorb-interop-server"
path = "src/server.rs"

[[bin]]
name = "rustorb-poa-probe-server"
path = "src/poa_probe_server.rs"

[[bin]]
name = "rustorb-dynany-probe"
path = "src/dynany_probe.rs"

[[bin]]
name = "rustorb-naming-check"
path = "src/naming_check.rs"

[dependencies]
rustorb-core.workspace = true
rustorb-naming.workspace = true
