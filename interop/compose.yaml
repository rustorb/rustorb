# Interop test topology: a naming service, an Echo server and a client.
#
# The implementation used by each role is chosen with environment variables,
# so that rustorb can be plugged in later without changing this file:
#
#   SERVER_IMPL / CLIENT_IMPL   directory under impls/ (omniorbpy, omniorb-cpp, rustorb)
#   *_IMAGE                     image that contains that implementation
#   NAMING_CMD                  command that starts the naming service
#                               (impls/rustorb/naming-service 2809 for rustorb)
#   CLIENT_MAX_GIOP             highest GIOP version the client uses (omniORB)
#
# Use run-matrix.sh rather than calling docker compose directly.

services:
  naming:
    image: ${NAMING_IMAGE:-rustorb-interop-omniorb:latest}
    hostname: naming
    command: ${NAMING_CMD:-run-omninames 2809}
    environment:
      NAMING_HOST: naming
    volumes:
      # The rustorb naming service is built on the host (run-matrix.sh,
      # run-naming-check.sh).
      - ./impls/rustorb:/opt/interop/impls/rustorb:ro

  server:
    image: ${SERVER_IMAGE:-rustorb-interop-omniorb:latest}
    hostname: server
    depends_on: [naming]
    volumes:
      # The rustorb server is built on the host (see run-matrix.sh).
      - ./impls/rustorb:/opt/interop/impls/rustorb:ro
    command:
      - impls/${SERVER_IMPL:-omniorbpy}/server
      - --naming
      - corbaloc::naming:2809/NameService
      - --name
      - interop/Echo
      - --host
      - server
      - --port
      - "2810"

  client:
    image: ${CLIENT_IMAGE:-rustorb-interop-omniorb:latest}
    hostname: client
    depends_on: [naming, server]
    # tcpdump needs these when CAPTURE_DIR is set.
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      CAPTURE_DIR: ${CAPTURE_DIR:-}
      # omniORB reads ORB<option> from the environment; empty means unset.
      ORBmaxGIOPVersion: ${CLIENT_MAX_GIOP:-}
      CAPTURE_LABELS: --port-label 2809=naming --port-label 2810=server --port-label 2811=client
    volumes:
      - ${OUT_DIR:-./out}:/out
      # The rustorb client is built on the host (see run-matrix.sh).
      - ./impls/rustorb:/opt/interop/impls/rustorb:ro
    command:
      - run-client
      - impls/${CLIENT_IMPL:-omniorbpy}/client
      - --naming
      - corbaloc::naming:2809/NameService
      - --name
      - interop/Echo
      - --host
      - client
      - --port
      - "2811"
      - --shutdown-server
