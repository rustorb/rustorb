[package]
name = "rustorb-jni"
description = "JNI library of the rustorb Java binding (librustorb_jni), on the C ABI of rustorb-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "rustorb_jni"
crate-type = ["cdylib"]
# The library only works loaded by a JVM; it is tested from Java
# (java/src/test).
test = false
doctest = false

[dependencies]
rustorb-ffi = { path = "../rustorb-ffi" }
jni = "0.21"
