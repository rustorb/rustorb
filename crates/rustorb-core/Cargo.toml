[package]
name = "rustorb-core"
description = "ORB core of rustorb: connections, request dispatch and POA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rustorb-cdr.workspace = true
rustorb-giop.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "io-util", "time"] }
socket2 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

# The resource samples of tests/soak.rs.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[[bench]]
name = "throughput"
harness = false
