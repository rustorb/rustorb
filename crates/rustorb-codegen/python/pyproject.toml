[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rustorb-idl"
version = "0.1.1"
description = "IDL code generator for rustorb"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
  "Topic :: Software Development :: Object Brokering",
]
# idl_parser 0.6.2 is the first release with the fixes the generator needs
# (sugarsweetrobotics/idl_parser#133-#144, #159); CI checks out the same commit.
dependencies = ["idl_parser>=0.6.2,<0.7"]

[project.urls]
Homepage = "https://github.com/rustorb/rustorb"
Documentation = "https://github.com/rustorb/rustorb/blob/main/docs/getting-started.md"
Changelog = "https://github.com/rustorb/rustorb/blob/main/CHANGELOG.md"

[project.scripts]
rustorb-idl = "rustorb_idl.cli:main_exit"

[tool.setuptools]
packages = ["rustorb_idl"]

[tool.setuptools.package-data]
rustorb_idl = ["idl/*.idl"]
