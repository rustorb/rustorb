name: Release

# Builds everything a release ships and attaches it to a draft GitHub
# Release. Nothing is published to crates.io or PyPI here; the maintainer
# does that from the draft, following docs/release.md.
#
# - a tag v0.1.0 (the version of tools/set-version.py --check): builds and
#   creates or updates the draft release v0.1.0
# - Run workflow (workflow_dispatch), or a pull request that changes the
#   packaging: only builds, the artifacts stay on the run

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/set-version.py
      - Cargo.toml
      - "crates/*/Cargo.toml"
      - cpp/CMakeLists.txt
      - "cpp/cmake/**"
      - "cpp/tests/consumer/**"
      - "**/pyproject.toml"
      - java/pom.xml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Check that every package has the version of the tag
        shell: bash
        run: |
          version=$(python3 tools/set-version.py --check)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME, but the packages are at $version"
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::no CHANGELOG.md entry for $version"; exit 1; }

  crates:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Packages and builds each crate against the others as packaged, in
      # the order cargo publish would upload them.
      - run: cargo publish --workspace --dry-run --locked --exclude rustorb-python --exclude rustorb-interop
      - run: cargo package --workspace --locked --no-verify --exclude rustorb-python --exclude rustorb-interop
      - uses: actions/upload-artifact@v4
        with:
          name: crates
          path: target/package/*.crate

  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # One abi3 wheel (CPython 3.9 or later) per platform.
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out ../dist
      - name: Install the wheel and import it
        shell: bash
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP" && python -I -c "import rustorb._native; from rustorb import CORBA; print(CORBA.ORB_init([]))"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  python-sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out ../dist
      # The pure Python packages: the IDL compiler and the omniORBpy
      # compatibility layer.
      - run: |
          python -m pip install build
          python -m build --outdir dist crates/rustorb-codegen/python
          python -m build --outdir dist python/omniorb-compat
      - name: Install rustorb-idl from the wheel (idl_parser from PyPI) and run it
        run: |
          python -m pip install dist/rustorb_idl-*.whl
          mkdir -p "$RUNNER_TEMP/gen"
          rustorb-idl --version
          rustorb-idl -bpython -C "$RUNNER_TEMP/gen" cpp/tests/consumer/Echo.idl
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*

  # librustorb_ffi (static and shared), the C++ headers and the CMake
  # package, per platform. The Java binding loads the shared library.
  native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-aarch64 }
          - { os: macos-latest, name: macos-aarch64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE: rustorb-native-${{ needs.version.outputs.version }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cmake -S cpp -B build/cpp -DRUSTORB_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/cpp --config Release
      - run: cmake --install build/cpp --config Release --prefix "dist/${{ env.ARCHIVE }}"
      - name: Add the shared library and the licenses
        shell: bash
        run: |
          d="dist/$ARCHIVE"
          case "$RUNNER_OS" in
            Linux) cp target/release/librustorb_ffi.so "$d/lib/" ;;
            macOS) cp target/release/librustorb_ffi.dylib "$d/lib/" ;;
            Windows) mkdir -p "$d/bin" && cp target/release/rustorb_ffi.dll "$d/bin/" ;;
          esac
          cp LICENSE-MIT LICENSE-APACHE "$d/"
      - name: Build an application against the installed package
        shell: bash
        run: |
          python -m pip install ./crates/rustorb-codegen/python
          cmake -S cpp/tests/consumer -B build/consumer "-DCMAKE_PREFIX_PATH=$PWD/dist/$ARCHIVE"
          cmake --build build/consumer --config Release
          ctest --test-dir build/consumer -C Release --output-on-failure
      - name: Archive
        shell: bash
        run: |
          cd dist
          if [[ "$RUNNER_OS" == Windows ]]; then 7z a "$ARCHIVE.zip" "$ARCHIVE"; else tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: dist/rustorb-native-*.*

  java:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The tests run in CI; the test IDLs still need idl_parser to compile.
      - run: python -m pip install "idl_parser>=0.6.2,<0.7"
      - run: mvn -B -f java/pom.xml -Dpython=python -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: java
          path: java/target/rustorb-*.jar

  draft:
    if: github.ref_type == 'tag'
    needs: [version, crates, wheels, python-sdist, native, java]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## \[/{p = index($0, "## [" v "]") == 1; next} p' CHANGELOG.md > notes.md
          (cd artifacts && sha256sum * > SHA256SUMS)
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" artifacts/* --draft --verify-tag --title "rustorb $TAG" --notes-file notes.md
          fi
