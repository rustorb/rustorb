name: Release

# Builds everything a release ships and publishes it (docs/release.md).
#
# - a tag v0.1.0 (the version of tools/set-version.py --check): builds and
#   checks everything, attaches it to a draft GitHub Release v0.1.0,
#   and publishes the crates to crates.io, the Python packages to PyPI, the .NET
#   package to NuGet and the gem to RubyGems, and then publishes the GitHub
#   Release. The publishing jobs run in the `release` environment (the PyPI
#   upload of rustorb-omniorb-compat in release-rustorb-omniorb-compat;
#   their protection rules can require an approval) and need the
#   CARGO_REGISTRY_TOKEN secret, and trusted publishers on PyPI, nuget.org
#   (with the NUGET_USER secret) and RubyGems, or the PYPI_API_TOKEN,
#   NUGET_API_KEY and RUBYGEMS_API_KEY secrets instead. Run again after a
#   failure, they skip what is already published.
# - Run workflow (workflow_dispatch), or a pull request that changes the
#   packaging: only builds, the artifacts stay on the run
# - Run workflow with check-publishing: only logs in to nuget.org and
#   RubyGems with trusted publishing, to check the setup; publishes nothing

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      check-publishing:
        description: "Only log in to nuget.org and RubyGems with trusted publishing (publishes nothing)"
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/set-version.py
      - Cargo.toml
      - "crates/*/Cargo.toml"
      - cpp/CMakeLists.txt
      - "cpp/cmake/**"
      - "cpp/tests/consumer/**"
      - "**/pyproject.toml"
      - java/pom.xml
      - c/CMakeLists.txt
      - dotnet/src/Rustorb.Corba/Rustorb.Corba.csproj
      - ruby/rustorb.gemspec
      - ruby/ext/rustorb_ext/extconf.rb
      - "tools/release-check/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gets a short-lived key from nuget.org and RubyGems (trusted publishing)
  # and pushes nothing.
  check-publishing:
    if: github.event_name == 'workflow_dispatch' && inputs.check-publishing
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Check the nuget.org user
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::set the NUGET_USER secret (docs/release.md)"
            exit 1
          fi
      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Log in to RubyGems
        uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Check the keys
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          [ -n "$NUGET_API_KEY" ] || { echo "::error::no key from nuget.org"; exit 1; }
          [ -n "$GEM_HOST_API_KEY" ] || { echo "::error::no key from RubyGems"; exit 1; }
          echo "nuget.org and RubyGems trusted publishing work"

  version:
    if: ${{ !inputs.check-publishing }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Check that every package has the version of the tag
        shell: bash
        run: |
          version=$(python3 tools/set-version.py --check)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME, but the packages are at $version"
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::no CHANGELOG.md entry for $version"; exit 1; }

  crates:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Packages and builds each crate against the others as packaged, in
      # the order cargo publish would upload them.
      - run: cargo publish --workspace --dry-run --locked --exclude rustorb-python --exclude rustorb-interop
      - run: cargo package --workspace --locked --no-verify --exclude rustorb-python --exclude rustorb-interop --exclude rustorb-mapping-tests
      - uses: actions/upload-artifact@v4
        with:
          name: crates
          path: target/package/*.crate

  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # One abi3 wheel (CPython 3.9 or later) per platform.
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out ../dist
      - name: Install the wheel and import it
        shell: bash
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP" && python -I -c "import rustorb._native; from rustorb import CORBA; print(CORBA.ORB_init([]))"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  python-sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out ../dist
      # The pure Python omniORBpy compatibility layer. The IDL compiler
      # (rustorb-idl) is released from https://github.com/rustorb/rustorb-idl.
      - run: |
          python -m pip install build
          python -m build --outdir dist python/omniorb-compat
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*

  # librustorb_ffi (static and shared), the C++ headers, the CMake package
  # and the rustorb-names naming service, per platform. The Java binding
  # loads the shared library. rustorb-names also goes into an archive of
  # its own, for those who want only the naming service.
  native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04 like aarch64: a library built on ubuntu-latest
          # (26.04) would need its newer glibc.
          - { os: ubuntu-24.04, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-aarch64 }
          - { os: macos-latest, name: macos-aarch64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE: rustorb-native-${{ needs.version.outputs.version }}-${{ matrix.name }}
      NAMES: rustorb-names-${{ needs.version.outputs.version }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cmake -S cpp -B build/cpp -DRUSTORB_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/cpp --config Release
      - run: cmake --install build/cpp --config Release --prefix "dist/${{ env.ARCHIVE }}"
      - run: cargo build --release --locked -p rustorb-naming --bin rustorb-names
      - name: Add the shared library, rustorb-names and the licenses
        shell: bash
        run: |
          d="dist/$ARCHIVE"
          n="dist/$NAMES"
          mkdir -p "$d/bin" "$n"
          case "$RUNNER_OS" in
            Linux) cp target/release/librustorb_ffi.so "$d/lib/" ;;
            macOS) cp target/release/librustorb_ffi.dylib "$d/lib/" ;;
            Windows) cp target/release/rustorb_ffi.dll "$d/bin/" ;;
          esac
          exe=rustorb-names
          if [[ "$RUNNER_OS" == Windows ]]; then exe=rustorb-names.exe; fi
          cp "target/release/$exe" "$d/bin/"
          cp "target/release/$exe" "$n/"
          cp LICENSE-MIT LICENSE-APACHE "$d/"
          cp LICENSE-MIT LICENSE-APACHE "$n/"
      - name: Check that rustorb-names starts
        shell: bash
        run: |
          "dist/$NAMES/rustorb-names" -memory -start 28090 > names.log 2>&1 &
          pid=$!
          for _ in $(seq 100); do grep -q listening names.log && break; sleep 0.1; done
          kill $pid || true
          cat names.log
          grep -q "listening as corbaloc::.*:28090/NameService" names.log
      - name: Build an application against the installed package
        shell: bash
        run: |
          python -m pip install -r tools/rustorb-idl.txt
          cmake -S cpp/tests/consumer -B build/consumer "-DCMAKE_PREFIX_PATH=$PWD/dist/$ARCHIVE"
          cmake --build build/consumer --config Release
          ctest --test-dir build/consumer -C Release --output-on-failure
      - name: Archive
        shell: bash
        run: |
          cd dist
          for a in "$ARCHIVE" "$NAMES"; do
            if [[ "$RUNNER_OS" == Windows ]]; then 7z a "$a.zip" "$a"; else tar czf "$a.tar.gz" "$a"; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          # the archive only: rustorb-native-*.* also matches the directory,
          # whose name has the dots of the version
          path: |
            dist/${{ env.ARCHIVE }}.tar.gz
            dist/${{ env.ARCHIVE }}.zip
            dist/${{ env.NAMES }}.tar.gz
            dist/${{ env.NAMES }}.zip
          if-no-files-found: error

  java:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The tests run in CI; the test IDLs still need rustorb-idl to compile.
      - run: python -m pip install -r tools/rustorb-idl.txt
      - run: mvn -B -f java/pom.xml -Dpython=python -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: java
          path: java/target/rustorb-*.jar

  # The C binding: librustorb_c and librustorb_ffi (static) with the
  # headers. The gem takes its librustorb_ffi.a from these archives.
  c:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-aarch64 }
          - { os: macos-latest, name: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE: rustorb-c-${{ needs.version.outputs.version }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cmake -S c -B build/c -DRUSTORB_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/c
      - run: cmake --install build/c --prefix "dist/$ARCHIVE"
      - name: Build and run a program against the installed files
        shell: bash
        run: |
          cp LICENSE-MIT LICENSE-APACHE "dist/$ARCHIVE/"
          d="dist/$ARCHIVE"
          libs=(-lpthread -ldl -lm)
          if [[ "$RUNNER_OS" == macOS ]]; then libs=(-framework CoreFoundation -framework Security -lpthread -lm); fi
          cc -std=c99 -Wall -Wextra -Werror -I"$d/include" tools/release-check/orb.c \
            "$d/lib/librustorb_c.a" "$d/lib/librustorb_ffi.a" "${libs[@]}" -o orb-check
          ./orb-check
      - name: Archive
        run: cd dist && tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
      - uses: actions/upload-artifact@v4
        with:
          name: c-${{ matrix.name }}
          path: dist/${{ env.ARCHIVE }}.tar.gz
          if-no-files-found: error

  # The NuGet package Rustorb, with the shared librustorb_ffi of every
  # platform of the rustorb-native archives in runtimes/<rid>/native.
  nuget:
    needs: [version, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native
          merge-multiple: true
      - name: Put the native libraries into runtimes/<rid>/native
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          r=dotnet/src/Rustorb.Corba/runtimes
          take() { # archive, file in it, rid
            mkdir -p "$r/$3/native" x
            case "$1" in
              *.zip) unzip -q -o "native/$1" -d x ;;
              *) tar xzf "native/$1" -C x ;;
            esac
            d="${1%.tar.gz}"
            cp "x/${d%.zip}/$2" "$r/$3/native/"
          }
          take "rustorb-native-$VERSION-linux-x86_64.tar.gz" lib/librustorb_ffi.so linux-x64
          take "rustorb-native-$VERSION-linux-aarch64.tar.gz" lib/librustorb_ffi.so linux-arm64
          take "rustorb-native-$VERSION-macos-aarch64.tar.gz" lib/librustorb_ffi.dylib osx-arm64
          take "rustorb-native-$VERSION-windows-x86_64.zip" bin/rustorb_ffi.dll win-x64
          find "$r" -type f
      - run: dotnet pack -c Release -o dist dotnet/src/Rustorb.Corba
      - name: Build and run a program against the package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir check && cp tools/release-check/Program.cs tools/release-check/check.csproj check/
          cd check
          dotnet restore -p:RustorbVersion="$VERSION" -s "$GITHUB_WORKSPACE/dist" -s https://api.nuget.org/v3/index.json
          dotnet run --no-restore -p:RustorbVersion="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: dist/*.nupkg
          if-no-files-found: error

  # The gem rustorb, with librustorb_ffi.a of each platform of the
  # rustorb-c archives in vendor/<platform>; its extension is built when
  # it is installed.
  gem:
    needs: [version, c]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/download-artifact@v4
        with:
          pattern: c-*
          path: c
          merge-multiple: true
      - name: Put librustorb_ffi.a and rustorb.h into vendor/
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for p in linux-x86_64 linux-aarch64 macos-aarch64; do
            a="rustorb-c-$VERSION-$p"
            tar xzf "c/$a.tar.gz" -C c
            mkdir -p "ruby/vendor/$p"
            cp "c/$a/lib/librustorb_ffi.a" "ruby/vendor/$p/"
          done
          mkdir -p ruby/vendor/include/rustorb
          cp crates/rustorb-ffi/include/rustorb/rustorb.h ruby/vendor/include/rustorb/
          find ruby/vendor -type f
      - run: cd ruby && gem build rustorb.gemspec && mkdir -p ../dist && mv rustorb-*.gem ../dist/
      - name: Install the gem and use it
        run: |
          gem install --local dist/rustorb-*.gem
          cd "$RUNNER_TEMP" && ruby -e 'require "rustorb"; o = CORBA.ORB_init([]); o.resolve_initial_references("RootPOA"); o.destroy; puts "rustorb: ok"'
      - uses: actions/upload-artifact@v4
        with:
          name: gem
          path: dist/*.gem
          if-no-files-found: error

  # Also runs without a tag, to check the notes and SHA256SUMS
  draft:
    needs: [version, crates, wheels, python-sdist, native, java, c, nuget, gem]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## \[/{p = index($0, "## [" v "]") == 1; next} p' CHANGELOG.md > notes.md
          test -s notes.md
          (cd artifacts && sha256sum * > SHA256SUMS)
          cat artifacts/SHA256SUMS
      - name: Create or update the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" artifacts/* --draft --verify-tag --title "rustorb $TAG" --notes-file notes.md
          fi

  crates-io:
    if: github.ref_type == 'tag'
    needs: [version, draft]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish the crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::the CARGO_REGISTRY_TOKEN secret is not set (docs/release.md)"
            exit 1
          fi
          # cargo publish waits until each crate is in the index before the
          # next one, which depends on it, is published.
          for crate in rustorb-cdr rustorb-typesupport rustorb-giop rustorb-core rustorb-ffi rustorb-naming; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "rustorb-release (github.com/rustorb/rustorb)" \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [ "$status" = 200 ]; then
              echo "$crate $VERSION is already on crates.io"
            else
              cargo publish --locked -p "$crate"
            fi
          done

  # One job per PyPI project: a pending trusted publisher (for a project's
  # first upload) can only be registered for one project with the same
  # repository, workflow and environment, so each project has its own
  # environment.
  pypi:
    if: github.ref_type == 'tag'
    needs: [version, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: rustorb, files: "rustorb-*", environment: release }
          - { project: rustorb-omniorb-compat, files: "rustorb_omniorb_compat-*", environment: release-rustorb-omniorb-compat }
    name: pypi (${{ matrix.project }})
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: all
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: python-sdist
          path: all
      - name: Pick the files of ${{ matrix.project }}
        env:
          FILES: ${{ matrix.files }}
        run: |
          mkdir dist
          for f in all/$FILES; do
            case "$f" in *.whl|*.tar.gz) mv "$f" dist/ ;; esac
          done
          ls -l dist
          [ -n "$(ls dist)" ] || { echo "::error::no files for ${{ matrix.project }}"; exit 1; }
      # Trusted publishing (OpenID Connect) when PYPI_API_TOKEN is not set.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  # Trusted publishing (OpenID Connect) unless the NUGET_API_KEY secret is
  # set: NuGet/login exchanges the job's token for a short-lived API key of
  # the nuget.org user in the NUGET_USER secret (docs/release.md).
  nuget-org:
    if: github.ref_type == 'tag'
    needs: [version, draft]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    env:
      NUGET_API_KEY_SECRET: ${{ secrets.NUGET_API_KEY }}
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: dist
      - name: Check the nuget.org user
        if: env.NUGET_API_KEY_SECRET == ''
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::set the NUGET_USER secret (or NUGET_API_KEY) (docs/release.md)"
            exit 1
          fi
      - name: Log in to nuget.org (trusted publishing)
        id: login
        if: env.NUGET_API_KEY_SECRET == ''
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push the package to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY || steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push dist/*.nupkg --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

  # Trusted publishing (OpenID Connect) unless the RUBYGEMS_API_KEY secret
  # is set (docs/release.md).
  rubygems:
    if: github.ref_type == 'tag'
    needs: [version, draft]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    env:
      RUBYGEMS_API_KEY_SECRET: ${{ secrets.RUBYGEMS_API_KEY }}
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/download-artifact@v4
        with:
          name: gem
          path: dist
      - name: Use the API key
        if: env.RUBYGEMS_API_KEY_SECRET != ''
        run: echo "GEM_HOST_API_KEY=$RUBYGEMS_API_KEY_SECRET" >> "$GITHUB_ENV"
      - name: Log in to RubyGems (trusted publishing)
        if: env.RUBYGEMS_API_KEY_SECRET == ''
        uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Push the gem to RubyGems
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://rubygems.org/api/v2/rubygems/rustorb/versions/$VERSION.json")
          if [ "$status" = 200 ]; then
            echo "rustorb $VERSION is already on RubyGems"
          else
            gem push dist/rustorb-*.gem
          fi

  publish-release:
    if: github.ref_type == 'tag'
    needs: [crates-io, pypi, nuget-org, rubygems]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
