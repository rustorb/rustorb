name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Check that every package has the same version (docs/release.md)
        run: python3 tools/set-version.py --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  python:
    name: Python (runtime, native module and generated code)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The IDL compiler, pinned (https://github.com/rustorb/rustorb-idl).
      - run: pip install -r tools/rustorb-idl.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: pip install mypy==1.13.0
      # The ORB tests (python/tests/test_orb.py) use the native module from
      # the source tree and code generated by rustorb-idl.
      - run: python/build-native.sh
      # Callback AMI (test_ami.py) needs a rustorb-idl with -bpython -Wbami,
      # not released yet: the tests use this commit of rustorb-idl until
      # tools/rustorb-idl.txt pins a release with it (#140).
      - uses: actions/checkout@v4
        with:
          repository: rustorb/rustorb-idl
          ref: 83fcc3e83de03d450daba866950d8d5ccc4bdce2
          path: rustorb-idl
      - run: python -m unittest discover -s python/tests -v
        env:
          RUSTORB_REQUIRE_NATIVE: "1"
          RUSTORB_IDL_DIR: ${{ github.workspace }}/rustorb-idl
      # The generator's own tests are in rustorb-idl; its CI also runs them
      # against this repository's main branch.
      - name: Check that the committed code of rustorb-idl -brust is up to date
        run: |
          tools/generate-rust.sh
          git diff --exit-code -- crates interop/impls/rustorb tests/mapping
          test -z "$(git status --porcelain -- crates interop/impls/rustorb tests/mapping)"
      - name: Build the wheel with maturin
        run: pip wheel ./python --no-deps -w dist
      - name: Build the wheel of the omniORBpy compatibility package
        run: pip wheel ./python/omniorb-compat --no-deps -w dist

  cpp:
    name: C++ (rustorb-ffi, the C++ mapping and rustorb-idl -bc++11)
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    runs-on: ubuntu-latest
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/rustorb-idl.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Callback AMI (test_ami.cc) needs a rustorb-idl with -bc++11 -Wbami,
      # not released yet: the build uses this commit of rustorb-idl until
      # tools/rustorb-idl.txt pins a release with it (#140).
      - uses: actions/checkout@v4
        with:
          repository: rustorb/rustorb-idl
          ref: 83fcc3e83de03d450daba866950d8d5ccc4bdce2
          path: rustorb-idl
      - run: cmake -S cpp -B build/cpp -DRUSTORB_IDL_DIR=${{ github.workspace }}/rustorb-idl
      - run: cmake --build build/cpp
      - run: ctest --test-dir build/cpp --output-on-failure

  cpp-sanitize:
    name: C++ with AddressSanitizer and LeakSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/rustorb-idl.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rustorb-idl with -Wbami, as in the cpp job above (#140).
      - uses: actions/checkout@v4
        with:
          repository: rustorb/rustorb-idl
          ref: 83fcc3e83de03d450daba866950d8d5ccc4bdce2
          path: rustorb-idl
      # Every C++ test with ASan; LeakSanitizer reports what the C++ runtime
      # and librustorb_ffi left unfreed at exit (tests/test_leak.cc above
      # all).
      - run: >
          cmake -S cpp -B build/cpp -DCMAKE_CXX_COMPILER=g++ -DRUSTORB_SANITIZE=address
          -DRUSTORB_IDL_DIR=${{ github.workspace }}/rustorb-idl
         
      - run: cmake --build build/cpp
      - run: ctest --test-dir build/cpp --output-on-failure

  java:
    name: Java (the Java mapping on the FFM API and rustorb-idl -bjava)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, java: "22" }
          - { os: ubuntu-latest, java: "25" }
          - { os: macos-latest, java: "25" }
          - { os: windows-latest, java: "25" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/rustorb-idl.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Callback AMI (AmiTest) and org.omg.Messaging need a rustorb-idl with
      # -bjava -Wbami, not released yet: this commit until
      # tools/rustorb-idl.txt pins a release with it (#140).
      - uses: actions/checkout@v4
        with:
          repository: rustorb/rustorb-idl
          ref: 83fcc3e83de03d450daba866950d8d5ccc4bdce2
          path: rustorb-idl
      - name: Keep a minidump of a crashed java.exe (temporary)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\dumps | Out-Null
          $k = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\java.exe'
          New-Item -Force -Path $k | Out-Null
          Set-ItemProperty -Path $k -Name DumpFolder -Value 'D:\dumps' -Type ExpandString
          Set-ItemProperty -Path $k -Name DumpType -Value 1 -Type DWord
          Set-ItemProperty -Path $k -Name DumpCount -Value 5 -Type DWord
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting' -Name DontShowUI -Value 1 -Type DWord
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting' -Name Disabled -Value 0 -Type DWord
      - run: mvn -B -f java/pom.xml -Dpython=python "-Drustorb.idl.dir=${{ github.workspace }}/rustorb-idl" verify
      # TEMPORARY (#139): AmiTest under cdb, to see where an intermittent crash on Windows is.
      - name: Run AmiTest under cdb (temporary)
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          set -x
          mvn -B -q -f java/pom.xml dependency:build-classpath -Dmdep.outputFile=cp.txt -Dmdep.includeScope=test
          curl -sSfL -o console.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar
          CP="java/target/test-classes;java/target/classes;$(cat java/cp.txt);console.jar"
          CDB="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          printf '%s\n' 'sxd av' 'sxd sov' 'sxd ii' 'sxd dz' 'sxd gp' 'sxd c000041d' 'g' '.echo CRASHED' 'r' '.ecxr' 'kn 100' '~*kn 60' 'lm' 'q' > cdb.txt
          for i in $(seq 1 12); do
            "$CDB" -G -lines -y "target\debug" -cf cdb.txt \
              java "-Djava.library.path=target\debug" --enable-native-access=ALL-UNNAMED -cp "$CP" \
              org.junit.platform.console.ConsoleLauncher --disable-banner --details=none --select-class org.rustorb.test.AmiTest > cdb.log 2>&1 || true
            if grep -q 'second chance' cdb.log; then sed -n '/second chance/,$p' cdb.log | head -3000; exit 1; fi
            tail -5 cdb.log
          done
      - name: Show what a crashed JVM left (temporary)
        if: failure()
        shell: bash
        run: |
          ls -la java java/target/surefire-reports || true
          for f in java/hs_err_pid*.log java/target/surefire-reports/*.dump*; do
            [ -f "$f" ] && { echo "=== $f"; head -c 20000 "$f"; }
          done
          true
      - name: Analyze the minidumps (temporary)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem D:\dumps -ErrorAction SilentlyContinue
          $cdb = Get-ChildItem -Recurse -ErrorAction SilentlyContinue -Path 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Filter cdb.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          Write-Output "cdb: $($cdb.FullName)"
          foreach ($d in Get-ChildItem D:\dumps -Filter *.dmp -ErrorAction SilentlyContinue) {
            Write-Output "=== $($d.FullName)"
            & $cdb.FullName -z $d.FullName -y "${{ github.workspace }}\target\debug" -c ".ecxr; kn 60; !analyze -v; ~*kn 30; q" 2>&1 | Select-Object -First 1500
          }
      # What a crashed test JVM left: its hs_err file and surefire's dumps.
      - name: Upload what a crashed JVM left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-crash-${{ matrix.os }}-${{ matrix.java }}
          path: |
            java/hs_err_pid*.log
            java/*.mdmp
            java/target/surefire-reports/*.dump*
            java/target/surefire-reports/*-output.txt
          if-no-files-found: ignore
      - name: Check that Ffi.java is up to date with rustorb.h
        run: python java/tools/gen-ffi.py --check
      - name: Check that the committed CosNaming and Messaging stubs are up to date
        if: runner.os == 'Linux'
        run: java/generate-stubs.sh && git diff --exit-code -- java
        env:
          RUSTORB_IDL_DIR: ${{ github.workspace }}/rustorb-idl

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked --exclude rustorb-interop --exclude rustorb-python
        env:
          RUSTDOCFLAGS: -D warnings

  examples:
    name: Examples (every server with every client, examples/run-all.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/rust
      # A rustorb-idl with -Wbami (the Java test IDLs), not released yet:
      # this commit until tools/rustorb-idl.txt pins a release with it (#140).
      - uses: actions/checkout@v4
        with:
          repository: rustorb/rustorb-idl
          ref: 83fcc3e83de03d450daba866950d8d5ccc4bdce2
          path: rustorb-idl
      # rustorb-idl and idl_parser from PyPI, as a user's install would
      # (but the Java build, which takes the checkout above).
      - run: examples/run-all.sh
        env:
          RUSTORB_IDL_DIR: ${{ github.workspace }}/rustorb-idl

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # The prebuilt cargo-fuzz is a musl binary and would default to the musl
      # target, which the sanitizers do not support.
      - name: Run each fuzz target for 60 seconds
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60
          done
