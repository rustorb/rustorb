name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  python:
    name: Python (IDL generator, runtime and native module)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The generator reads IDL with idl_parser, pinned to a tested commit.
      - uses: actions/checkout@v4
        with:
          repository: sugarsweetrobotics/idl_parser
          ref: 5eef768bb61e0ee7c5cd08c42c45789a45585f60
          path: idl_parser
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: pip install mypy==1.13.0
      # The ORB tests (python/tests/test_orb.py) use the native module from
      # the source tree and code generated by rustorb-idl.
      - run: python/build-native.sh
      - run: python -m unittest discover -s python/tests -v
        env:
          PYTHONPATH: ${{ github.workspace }}/idl_parser
          RUSTORB_REQUIRE_NATIVE: "1"
      - run: python -m unittest discover -s crates/rustorb-codegen/python/tests -v
        env:
          PYTHONPATH: ${{ github.workspace }}/idl_parser
      - name: Check that the committed code of rustorb-idl -brust is up to date
        run: |
          crates/rustorb-codegen/generate-rust.sh
          git diff --exit-code -- crates interop/impls/rustorb
          test -z "$(git status --porcelain -- crates interop/impls/rustorb)"
        env:
          IDL_PARSER_DIR: ${{ github.workspace }}/idl_parser
      - name: Build the wheel with maturin
        run: pip wheel ./python --no-deps -w dist
      - name: Build the wheel of the omniORBpy compatibility package
        run: pip wheel ./python/omniorb-compat --no-deps -w dist

  cpp:
    name: C++ (rustorb-ffi, the C++ mapping and rustorb-idl -bc++11)
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    runs-on: ubuntu-latest
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sugarsweetrobotics/idl_parser
          ref: 5eef768bb61e0ee7c5cd08c42c45789a45585f60
          path: idl_parser
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cmake -S cpp -B build/cpp -DIDL_PARSER_DIR=${{ github.workspace }}/idl_parser
      - run: cmake --build build/cpp
      - run: ctest --test-dir build/cpp --output-on-failure

  cpp-sanitize:
    name: C++ with AddressSanitizer and LeakSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sugarsweetrobotics/idl_parser
          ref: 5eef768bb61e0ee7c5cd08c42c45789a45585f60
          path: idl_parser
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every C++ test with ASan; LeakSanitizer reports what the C++ runtime
      # and librustorb_ffi left unfreed at exit (tests/test_leak.cc above
      # all).
      - run: >
          cmake -S cpp -B build/cpp -DCMAKE_CXX_COMPILER=g++ -DRUSTORB_SANITIZE=address
          -DIDL_PARSER_DIR=${{ github.workspace }}/idl_parser
      - run: cmake --build build/cpp
      - run: ctest --test-dir build/cpp --output-on-failure

  java:
    name: Java (the Java mapping on the FFM API and rustorb-idl -bjava)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, java: "22" }
          - { os: ubuntu-latest, java: "25" }
          - { os: macos-latest, java: "25" }
          - { os: windows-latest, java: "25" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sugarsweetrobotics/idl_parser
          ref: 5eef768bb61e0ee7c5cd08c42c45789a45585f60
          path: idl_parser
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # bash: PowerShell would split -Didl.parser.dir=... at the dot.
      - run: mvn -B -f java/pom.xml -Dpython=python "-Didl.parser.dir=${{ github.workspace }}/idl_parser" verify
        shell: bash
      - name: Check that Ffi.java is up to date with rustorb.h
        run: python java/tools/gen-ffi.py --check
      - name: Check that the committed CosNaming stubs are up to date
        if: runner.os == 'Linux'
        run: java/generate-stubs.sh && git diff --exit-code -- java
        env:
          IDL_PARSER_DIR: ${{ github.workspace }}/idl_parser

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # The prebuilt cargo-fuzz is a musl binary and would default to the musl
      # target, which the sanitizers do not support.
      - name: Run each fuzz target for 60 seconds
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60
          done
