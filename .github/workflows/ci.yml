name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Check that every package has the same version (docs/release.md)
        run: python3 tools/set-version.py --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  python:
    name: Python (runtime, native module and generated code)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    # ubuntu-latest (26.04) has no Python 3.9 for setup-python; 24.04 has.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The IDL compiler, pinned (https://github.com/rustorb/rustorb-idl).
      - run: pip install -r tools/rustorb-idl.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: pip install mypy==1.13.0
      # The ORB tests (python/tests/test_orb.py) use the native module from
      # the source tree and code generated by rustorb-idl.
      - run: python/build-native.sh
      - run: python -m unittest discover -s python/tests -v
        env:
          RUSTORB_REQUIRE_NATIVE: "1"
      # The generator's own tests are in rustorb-idl; its CI also runs them
      # against this repository's main branch.
      - name: Check that the committed code of rustorb-idl -brust is up to date
        run: |
          tools/generate-rust.sh
          git diff --exit-code -- crates interop/impls/rustorb tests/mapping
          test -z "$(git status --porcelain -- crates interop/impls/rustorb tests/mapping)"
      - name: Build the wheel with maturin
        run: pip wheel ./python --no-deps -w dist
      - name: Build the wheel of the omniORBpy compatibility package
        run: pip wheel ./python/omniorb-compat --no-deps -w dist

  cpp:
    name: C++ (rustorb-ffi, the C++ mapping and rustorb-idl -bc++11)
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    runs-on: ubuntu-latest
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/rustorb-idl.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cmake -S cpp -B build/cpp
      - run: cmake --build build/cpp
      - run: ctest --test-dir build/cpp --output-on-failure

  cpp-sanitize:
    name: C++ with AddressSanitizer and LeakSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/rustorb-idl.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every C++ test with ASan; LeakSanitizer reports what the C++ runtime
      # and librustorb_ffi left unfreed at exit (tests/test_leak.cc above
      # all).
      - run: >
          cmake -S cpp -B build/cpp -DCMAKE_CXX_COMPILER=g++ -DRUSTORB_SANITIZE=address
      - run: cmake --build build/cpp
      - run: ctest --test-dir build/cpp --output-on-failure

  java:
    name: Java (the Java mapping on the FFM API and rustorb-idl -bjava)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, java: "22" }
          - { os: ubuntu-latest, java: "25" }
          - { os: macos-latest, java: "25" }
          - { os: windows-latest, java: "25" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/rustorb-idl.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: mvn -B -f java/pom.xml -Dpython=python verify
      - name: Check that Ffi.java is up to date with rustorb.h
        run: python java/tools/gen-ffi.py --check
      - name: Check that the committed CosNaming and Messaging stubs are up to date
        if: runner.os == 'Linux'
        run: java/generate-stubs.sh && git diff --exit-code -- java

  dotnet:
    name: .NET (the IDL4 to C# mapping on rustorb-ffi and rustorb-idl -bcsharp)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # -bcsharp is not in a release of rustorb-idl yet: the commit that has
      # it, until rustorb-idl 0.5.0 (#189) and tools/rustorb-idl.txt.
      - run: >
          pip install idl_parser==0.6.2
          "rustorb-idl @ git+https://github.com/rustorb/rustorb-idl@1dca3548b985d87e5684f27479ee854a665c8b71#subdirectory=python"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: dotnet build -c Release dotnet/src/Rustorb.Corba
      - run: dotnet test dotnet/tests/Rustorb.Tests -p:Python=python
      - name: Check that Ffi.g.cs is up to date with rustorb.h
        run: python dotnet/tools/gen-pinvoke.py --check
      - name: Check that the committed CosNaming stubs are up to date
        if: runner.os == 'Linux'
        run: dotnet/generate-stubs.sh && git diff --exit-code -- dotnet

  c:
    name: C (the OMG C mapping on rustorb-ffi and rustorb-idl -bc)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # -bc is not in a release of rustorb-idl yet: the commit that has it,
      # until rustorb-idl 0.5.0 (#189) and tools/rustorb-idl.txt.
      - run: >
          pip install idl_parser==0.6.2
          "rustorb-idl @ git+https://github.com/rustorb/rustorb-idl@1dca3548b985d87e5684f27479ee854a665c8b71#subdirectory=python"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cmake -S c -B build/c
      - run: cmake --build build/c
      - run: ctest --test-dir build/c --output-on-failure
      - name: Check that the committed CosNaming stubs are up to date
        if: runner.os == 'Linux' && matrix.cc == 'gcc'
        run: c/generate-stubs.sh && git diff --exit-code -- c

  c-sanitize:
    name: C with AddressSanitizer and LeakSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >
          pip install idl_parser==0.6.2
          "rustorb-idl @ git+https://github.com/rustorb/rustorb-idl@1dca3548b985d87e5684f27479ee854a665c8b71#subdirectory=python"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cmake -S c -B build/c -DCMAKE_C_COMPILER=gcc -DRUSTORB_SANITIZE=address
      - run: cmake --build build/c
      - run: ctest --test-dir build/c --output-on-failure

  ruby:
    name: Ruby (the OMG Ruby mapping on rustorb-ffi and rustorb-idl -bruby)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, ruby: "3.0" }
          - { os: ubuntu-latest, ruby: "3.4" }
          - { os: macos-latest, ruby: "3.4" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # -bruby is not in a release of rustorb-idl yet: the commit that has it,
      # until rustorb-idl 0.5.0 (#189) and tools/rustorb-idl.txt.
      - run: >
          pip install idl_parser==0.6.2
          "rustorb-idl @ git+https://github.com/rustorb/rustorb-idl@1dca3548b985d87e5684f27479ee854a665c8b71#subdirectory=python"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Builds librustorb_ffi and the extension, generates the test code and
      # runs ruby/test.
      - run: rake
        working-directory: ruby
      - name: Check that the committed CosNaming code is up to date
        if: runner.os == 'Linux' && matrix.ruby == '3.4'
        run: rake cos_naming && git diff --exit-code -- lib
        working-directory: ruby

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked --exclude rustorb-interop --exclude rustorb-python
        env:
          RUSTDOCFLAGS: -D warnings

  examples:
    name: Examples (every server with every client, examples/run-all.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/rust
      # rustorb-idl and idl_parser from PyPI, as a user's install would.
      - run: examples/run-all.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # The prebuilt cargo-fuzz is a musl binary and would default to the musl
      # target, which the sanitizers do not support.
      - name: Run each fuzz target for 60 seconds
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60
          done
