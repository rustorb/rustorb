name: Interop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  omniorb:
    name: omniORB / omniORBpy / JacORB matrix
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      # rustorb-idl generates the stubs of the rustorb Python client and
      # server (impls/rustorbpy/build.sh) and the code of
      # run-pymapping-check.sh.
      IDL_PARSER_DIR: ${{ github.workspace }}/idl_parser
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The rustorb clients and servers (Rust, and the Python package with
      # its native module) are built on the runner and mounted into the
      # containers.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # rustorb-idl runs on the runner. The runner's Python is the image's
      # (3.12, Ubuntu 24.04).
      - uses: actions/checkout@v4
        with:
          repository: sugarsweetrobotics/idl_parser
          ref: 5eef768bb61e0ee7c5cd08c42c45789a45585f60
          path: idl_parser
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # javac for the rustorb Java client and server
      # (impls/rustorbjava/build.sh); the image runs them on Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # omniORB and omniORBpy are built from source; the GitHub Actions cache
      # keeps that layer, so only the test implementations are rebuilt.
      - name: Build the omniORB image
        uses: docker/build-push-action@v6
        with:
          context: interop
          file: interop/docker/omniorb/Dockerfile
          tags: rustorb-interop-omniorb:latest
          load: true
          cache-from: type=gha,scope=interop-omniorb
          cache-to: type=gha,scope=interop-omniorb,mode=max

      - name: Run the client / server matrix
        run: interop/run-matrix.sh --capture

      # GIOP 1.1 has its own Fragment layout; the captures check it.
      - name: Run the matrix with GIOP 1.1 clients
        run: interop/run-matrix.sh --capture --giop 1.1

      # The stage 2 suite (AnyTest.idl): Any and TypeCode values.
      - name: Run the Any / TypeCode matrix
        run: interop/run-matrix.sh --suite any

      - name: Run the Any / TypeCode matrix with GIOP 1.1 clients
        run: interop/run-matrix.sh --suite any --giop 1.1

      # The valuetype suite (ValueTest.idl).
      - name: Run the valuetype matrix
        run: interop/run-matrix.sh --suite value

      - name: Run the valuetype matrix with GIOP 1.1 clients
        run: interop/run-matrix.sh --suite value --giop 1.1

      # The Java client and server built from JacORB's generated stubs,
      # skeletons and Helpers on the rustorb Java runtime (portable stubs
      # and streams, ObjectImpl._request), against every implementation.
      # The any suite is left out as for jacorb (its Helpers do not follow
      # AnyTest.idl); see docs/java-binding.md.
      - name: Run the matrix with JacORB-generated stubs on rustorb
        run: |
          p=rustorbjava-portable
          pairs="$p:$p"
          for x in omniorbpy omniorb-cpp jacorb rustorb rustorbpy rustorbcpp rustorbjava; do
            pairs="$pairs $p:$x $x:$p"
          done
          interop/run-matrix.sh $pairs
          interop/run-matrix.sh --giop 1.1 $pairs
          interop/run-matrix.sh --suite value $pairs

      # omniORBpy and the rustorb clients (Rust, Python, C++, Java).
      - name: Run the naming service check
        run: interop/run-naming-check.sh

      # The same check and matrix with the rustorb naming service in place
      # of omniNames, and a restart of it.
      - name: Run the naming service check against rustorb-names
        run: interop/run-naming-check.sh --naming rustorb

      - name: Run the matrix with rustorb-names
        run: interop/run-matrix.sh --naming rustorb

      - name: Send hand-built GIOP requests to each server
        run: interop/run-wire-probe.sh

      - name: Probe the POA and thread model of each server
        run: interop/run-poa-probe.sh

      - name: Probe the client call timeouts of omniORBpy and rustorbpy
        run: interop/run-timeout-probe.sh

      - name: Probe the remaining ORB operations of omniORBpy and rustorbpy
        run: interop/run-orb-ops-probe.sh

      - name: Probe DynAny on omniORB C++ and rustorb (Rust, Python, C++, Java)
        run: interop/run-dynany-probe.sh

      - name: Compare the generated Python code with omniidl -bpython
        run: interop/run-pymapping-check.sh

      # OpenRTM-aist-Python on rustorb through the omniORBpy compatibility
      # package, connected with RTCs on omniORBpy and OpenRTM-aist (C++), and
      # rtshell on rustorb and on omniORBpy.
      - name: Run OpenRTM-aist examples and rtshell
        run: interop/run-openrtm.sh

      - name: Run OpenRTM-aist examples and rtshell with rustorb-names
        run: interop/run-openrtm.sh --naming rustorb

      - name: Compare GIOP captures with the golden files
        run: interop/scripts/golden-compare --all interop/out interop/golden

      - name: Upload logs and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-omniorb
          path: interop/out
          if-no-files-found: ignore
