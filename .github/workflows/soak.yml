name: Soak

# The long versions of the load, soak and leak tests (issue #49), which
# ci.yml and interop.yml run in short on every change: more clients,
# requests and restarts (RUSTORB_STRESS_SCALE), a long run that samples
# memory, file descriptors and threads (RUSTORB_SOAK_SECS), more rounds of
# the leak checks of each binding (RUSTORB_LEAK_ROUNDS), and longer load
# phases against omniORB. See docs/load-testing.md.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: Length of the soak test in seconds
        default: "1800"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTORB_STRESS_SCALE: "10"
  RUSTORB_LEAK_ROUNDS: "20"

jobs:
  rust:
    name: Rust load and soak tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked -p rustorb-core --test stress -- --nocapture
      - run: cargo test --release --locked -p rustorb-core --test soak -- --nocapture
        env:
          RUSTORB_SOAK_SECS: ${{ inputs.soak_seconds || '1800' }}

  python:
    name: Python leak checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sugarsweetrobotics/idl_parser
          ref: 5eef768bb61e0ee7c5cd08c42c45789a45585f60
          path: idl_parser
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python/build-native.sh --release
      - run: python -m unittest discover -s python/tests -p test_leak.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}/idl_parser
          RUSTORB_REQUIRE_NATIVE: "1"

  cpp:
    name: C++ leak checks with LeakSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sugarsweetrobotics/idl_parser
          ref: 5eef768bb61e0ee7c5cd08c42c45789a45585f60
          path: idl_parser
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >
          cmake -S cpp -B build/cpp -DCMAKE_CXX_COMPILER=g++ -DRUSTORB_SANITIZE=address
          -DIDL_PARSER_DIR=${{ github.workspace }}/idl_parser
      - run: cmake --build build/cpp --target test_leak
      - run: ctest --test-dir build/cpp -R leak --output-on-failure

  java:
    name: Java leak checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sugarsweetrobotics/idl_parser
          ref: 5eef768bb61e0ee7c5cd08c42c45789a45585f60
          path: idl_parser
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >
          mvn -B -f java/pom.xml -Dpython=python "-Didl.parser.dir=${{ github.workspace }}/idl_parser"
          -Dtest=LeakTest -Dsurefire.failIfNoSpecifiedTests=false verify

  local:
    # interop/run-load-local.py, the entry for developers' own machines
    # (issue #63), on each OS: every rustorb implementation natively, the
    # stress and soak tests, and the results with the machine's details.
    # Windows runs the Rust implementation only.
    name: Native load (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sugarsweetrobotics/idl_parser
          ref: 5eef768bb61e0ee7c5cd08c42c45789a45585f60
          path: idl_parser
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >
          python interop/run-load-local.py --tests load,stress,soak --seconds 5
          --soak-secs 300 --idl-parser idl_parser --out interop/out/load-local/ci
      - if: always()
        shell: bash
        run: cat interop/out/load-local/ci/result.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-local-${{ matrix.os }}
          path: interop/out/load-local
          if-no-files-found: ignore

  load:
    name: Load against omniORB / omniORBpy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IDL_PARSER_DIR: ${{ github.workspace }}/idl_parser
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/checkout@v4
        with:
          repository: sugarsweetrobotics/idl_parser
          ref: 5eef768bb61e0ee7c5cd08c42c45789a45585f60
          path: idl_parser
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the omniORB image
        uses: docker/build-push-action@v6
        with:
          context: interop
          file: interop/docker/omniorb/Dockerfile
          tags: rustorb-interop-omniorb:latest
          load: true
          cache-from: type=gha,scope=interop-omniorb
      - run: interop/run-load.sh --seconds 20 --threads 16 --connections 64
      - run: cat interop/out/load.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load
          path: interop/out
          if-no-files-found: ignore
